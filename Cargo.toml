[package]
name = "reed"
version = "0.1.0"
edition = "2024"
description = "The judge for verifiable-evidence graphs: rules admit claims (sequent semiring Datalog), gradual semantics score them, every verdict carries its proof."
license = "Apache-2.0"
repository = "https://github.com/rustforrecess/reed"
keywords = ["argumentation", "evidence", "provenance", "explainable", "neurosymbolic"]
categories = ["science"]

[dependencies]
evidence-core = { path = "../evidence-core" }
sequent = { path = "../sequent" }
serde_json = "1"
